# ============================================================
# GWgpu_jax — packaging metadata
# Build backend: Hatchling (modern, glob-aware excludes).
# Install (Colab GPU runtime):
#   !pip install -q "gwgpu_jax[data] @ git+https://github.com/saulo-albuquerque-phys/GWgpu-jax.git"
# Install (local, editable, CPU):
#   pip install -e ".[data]"
# ============================================================

[build-system]
requires      = ["hatchling>=1.18"]
build-backend = "hatchling.build"


[project]
name            = "gwgpu_jax"
version         = "0.1.0"
description     = "JAX-based gravitational-wave parameter-estimation toolkit (waveforms, interferometer networks, nested sampling)."
readme          = "README.md"
requires-python = ">=3.10"
# GPL-3: gwgpu_jax bundles and modifies mlgw_bns (GPL-3, Jacopo Tissino) under
# gwgpu_jax/mlgw_jax/mlgw_bns_jax/, which makes this a derivative work.
license         = { text = "GPL-3.0-or-later" }
authors         = [
    { name = "Saulo Soares de Albuquerque Filho", email = "saulosoaresfisica@gmail.com" },
]
keywords        = [
    "gravitational-waves", "jax", "parameter-estimation",
    "nested-sampling", "ligo", "virgo", "kagra",
]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# JAX is pinned to the 0.4.x line: the handley-lab/blackjax nested-sampling
# fork was built against jax 0.4.x, and the Colab GPU image's CUDA plugin
# (jax_cuda12_plugin 0.5.x) is also incompatible with jaxlib 0.10+
# (register_custom_type_id_handler was removed there). The upper bound
# avoids breaking Colab installs.
dependencies = [
    "jax>=0.4.31,<0.5",
    "jaxlib>=0.4.31,<0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "h5py>=3.10",
    "matplotlib>=3.7",
    # ripplegw's top-level helper layout changed between 0.0.9 and 0.0.10;
    # we no longer import ms_to_Mc_eta from it (inlined inside gwgpu_jax) but
    # IMRPhenom* waveform imports must still match the package layout.
    "ripplegw>=0.0.9",
    "blackjax @ git+https://github.com/handley-lab/blackjax.git@dedbf11da33eb5ca286f6731e2c51f2b254b953f",
]


[project.optional-dependencies]
# Colab / Linux + NVIDIA GPU — pulls jax-cuda12 plugin packages.
# Colab GPU runtimes already ship a compatible CUDA plugin; this extra is
# only needed on plain Linux boxes where JAX was installed CPU-only.
gpu  = ["jax[cuda12]>=0.4.31,<0.5"]

# Real-data ingest via gwpy + GWOSC.
data = ["gwpy>=3.0", "gwosc>=0.7"]

# Heavy ML-based waveform models (mlgw_bbh_jax / mlgw_bns_jax via TF2JAX).
# joblib is imported at module load by mlgw/GW_generator.py, so mlgw_bbh_jax
# fails to import without it. It is not pulled in by tensorflow or tf2jax.
mlgw = ["tensorflow>=2.13,<2.16", "tf2jax>=0.3.6", "joblib>=1.3"]

# Auxiliary samplers and post-processing tools.
samplers = [
    "bilby>=2.5",
    "dynesty>=2.1",
    "emcee>=3.1",
    "anesthetic>=2.9",
    "corner>=2.2",
    "tqdm>=4.66",
]

# Convenience meta-extra for users who want everything except GPU wheels.
all = [
    "gwpy>=3.0", "gwosc>=0.7",
    "tensorflow>=2.13,<2.16", "tf2jax>=0.3.6", "joblib>=1.3",
    "bilby>=2.5", "dynesty>=2.1", "emcee>=3.1",
    "anesthetic>=2.9", "corner>=2.2", "tqdm>=4.66",
]

dev = ["pytest>=7", "pytest-xdist>=3", "hatchling>=1.18"]


[project.urls]
Homepage   = "https://github.com/saulo-albuquerque-phys/GWgpu-jax"
Repository = "https://github.com/saulo-albuquerque-phys/GWgpu-jax"
Issues     = "https://github.com/saulo-albuquerque-phys/GWgpu-jax/issues"


# ── Build configuration ──────────────────────────────────────────────────────
# Ship the `gwgpu_jax/` package plus the runtime-needed mlgw subpackages, but
# *exclude* the heavy research artefacts (paper drafts, training scripts,
# docs builds — about 700 MB total inside mlgw_bbh_jax/).
[tool.hatch.build.targets.wheel]
packages = ["gwgpu_jax"]

[tool.hatch.build]
include = [
    "gwgpu_jax/**",
    "README.md",
    "LICENSE*",
]
exclude = [
    # Local virtual envs (in repo root, but be defensive)
    "venv/**",
    "test_venv_mlgw/**",

    # Caches & build artefacts
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.pytest_cache/**",
    "**/.ipynb_checkpoints/**",

    # mlgw_bbh_jax research artefacts (NOT needed at runtime)
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/paper/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/paper_NN/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/paper_jax/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/dev/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/docs/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/examples/**",
    "gwgpu_jax/mlgw_jax/mlgw_bbh_jax/bin/**",

    # Repo-level images and notebooks
    "*.png",
    "*.jpg",
    "*.ipynb",
]

# Include non-Python assets (model weights, READMEs inside subpackages).
[tool.hatch.build.targets.wheel.shared-data]
# Nothing here; we ship everything as part of the gwgpu_jax package tree.

[tool.hatch.metadata]
allow-direct-references = true   # required for the blackjax git URL
